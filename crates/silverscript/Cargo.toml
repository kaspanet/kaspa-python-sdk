[workspace]
# Standalone workspace (excluded from the root one) so this crate keeps its own
# Cargo.lock. SilverScript takes its rusty-kaspa crates from crates.io, and this
# crate must use the same source so the types line up, while the core crate
# builds against a rusty-kaspa git revision. Both sides are on the same risc0
# line again, so the two workspaces could be merged once the core crate also
# moves to crates.io releases.

[workspace.package]
# Keep in sync with the root Cargo.toml `[workspace.package]`.
version = "2.1.0"
edition = "2024"

[package]
name = "kaspa-python-sdk-silverscript"
version.workspace = true
edition.workspace = true

[lib]
# Compiled to `kaspa/experimental/silverscript/silverscript.<abi>.so` and re-exported by
# `kaspa/experimental/silverscript/__init__.py` as `from .silverscript import *`.
name = "silverscript"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "stub-gen"
path = "src/bin/stub_gen.rs"

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
kaspa-python-sdk-core = { path = "../core" }
pyo3 = { version = "0.27.1" }
pyo3-stub-gen = "0.17.2"
self_cell = "1"
serde_json = "1.0.149"
silverscript-lang = { git = "https://github.com/kaspanet/silverscript.git", rev = "7eb04634bfbae5350c1808efc7e34c4efa7f93af" }
silverscript-abi = { git = "https://github.com/kaspanet/silverscript.git", rev = "7eb04634bfbae5350c1808efc7e34c4efa7f93af" }
silverscript-debugger-session = { git = "https://github.com/kaspanet/silverscript.git", rev = "7eb04634bfbae5350c1808efc7e34c4efa7f93af" }
kaspa-consensus-core = "2.1.0"
kaspa-txscript = "2.2.0"
