[package]
name = "kaspa-python-sdk-silverscript"
version.workspace = true
edition.workspace = true

[lib]
# Compiled to `kaspa/experimental/silverscript/silverscript.<abi>.so` and re-exported by
# `kaspa/experimental/silverscript/__init__.py` as `from .silverscript import *`.
name = "silverscript"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "stub-gen"
path = "src/bin/stub_gen.rs"

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
kaspa-python-sdk-core = { path = "../core" }
pyo3 = { version = "0.27.1" }
pyo3-stub-gen = "0.17.2"
self_cell = "1"
serde_json = "1.0.149"
silverscript-lang = { git = "https://github.com/kaspanet/silverscript.git", rev = "3ed973335b59269293564805cc2c58a14595ec03" }
silverscript-abi = { git = "https://github.com/kaspanet/silverscript.git", rev = "3ed973335b59269293564805cc2c58a14595ec03" }
debugger-session = { git = "https://github.com/kaspanet/silverscript.git", rev = "3ed973335b59269293564805cc2c58a14595ec03" }
kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "a41a333b08848f41bf737b72592e463a6011b8ac" }
kaspa-txscript = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "a41a333b08848f41bf737b72592e463a6011b8ac" }
